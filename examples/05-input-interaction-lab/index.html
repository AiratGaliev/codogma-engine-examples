<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Input Interaction Lab — Codogma Engine</title>
  <style>
    :root { color-scheme: dark; background: #080e1b; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #080e1b; }
    #game-root { width: min(100vw, 960px); }
    canvas { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <main id="game-root" aria-label="Input Interaction Lab"></main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.js"></script>
  <script src="game.js"></script>
</body>
</html>
